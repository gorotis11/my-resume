apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-${BUILD_NUMBER}
spec:
  template:
    spec:
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          args:
            # [수정] Git 저장소에서 직접 소스를 가져와 빌드 (볼륨 마운트 제거)
            - "--context=git://github.com/gorotis11/my-resume.git#refs/heads/${GIT_BRANCH}"
            - "--dockerfile=docker/Dockerfile"
            - "--destination=local-registry.registry.svc.cluster.local:443/my-resume:${BUILD_NUMBER}"
            - "--skip-tls-verify"
            - "--insecure"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi" # 메모리 부족으로 인한 OOM 방지
      restartPolicy: Never
  backoffLimit: 0